name: Upstream sync

# Weekly check of the official ElysiaJS documentation. When it changed, the
# converted content is proposed as a pull request; nothing is deployed until a
# maintainer reviews and merges it (production deploys only from main).

on:
  schedule:
    - cron: '23 4 * * 1' # Mondays, 04:23 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream branch or full commit SHA to sync to
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # push the automation/upstream-sync branch
      pull-requests: write # open or update the pull request
      issues: write # report failed syncs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Import the latest upstream documentation
        id: sync
        run: pnpm docs:sync --ref "$UPSTREAM_REF"
        env:
          UPSTREAM_REF: ${{ inputs.ref || 'main' }}

      # Pull requests opened with the default GITHUB_TOKEN do not trigger other
      # workflows, so the full validation runs here and its result is reported in
      # the pull request. Set a SYNC_TOKEN secret (fine-grained PAT or GitHub App
      # token) to have CI run on the pull request as well.
      - name: Validate the synced content
        id: validate
        if: steps.sync.outputs.changed == 'true'
        continue-on-error: true
        run: |
          pnpm typecheck
          pnpm test
          pnpm docs:check
          pnpm build
          pnpm docs:check --dist

      - name: Add the validation result to the pull request description
        if: steps.sync.outputs.changed == 'true'
        env:
          OUTCOME: ${{ steps.validate.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo ""
            echo "### Validation"
            echo ""
            if [ "$OUTCOME" = "success" ]; then
              echo "✅ Type check, tests, \`docs:check\`, build and \`docs:check --dist\` passed in [the sync run]($RUN_URL)."
            else
              echo "❌ Validation failed in [the sync run]($RUN_URL). This pull request is a draft and must not be merged until the failure is fixed."
            fi
          } >> reports/sync-summary.md

      - name: Open or update the pull request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.SYNC_TOKEN || github.token }}
          branch: automation/upstream-sync
          delete-branch: true
          commit-message: 'docs: sync upstream documentation to ${{ steps.sync.outputs.short_commit }}'
          title: 'docs: sync upstream documentation (${{ steps.sync.outputs.short_commit }})'
          body-path: reports/sync-summary.md
          labels: upstream-sync
          draft: ${{ steps.validate.outcome != 'success' }}
          add-paths: |
            src/content/docs
            src/generated
            public/upstream
            reports/migration-report.md
            reports/migration-report.json
            third-party/elysia-documentation

      - name: Fail the run when validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1

      - name: Report the failure in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Upstream documentation sync failed"
          body="The scheduled upstream sync failed: $RUN_URL. Nothing was published. See the run log and reports/migration-report.md for details."
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
